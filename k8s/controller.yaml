apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
    spec:
      containers:
        - name: marketplace-controller
          image: marketplace-controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REPLICA_ADDRESSES
              value: "storage-0.storage:50052,storage-1.storage:50052,storage-2.storage:50052"
            - name: HEARTBEAT_INTERVAL
              value: "5"
            - name: FAILURE_THRESHOLD
              value: "3"