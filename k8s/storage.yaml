apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
spec:
  serviceName: storage
  replicas: 2
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
    spec:
      containers:
        - name: marketplace-storage
          image: marketplace-storage:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PORT
              value: "50052"

---

apiVersion: v1
kind: Service
metadata:
  name: storage
spec:
  clusterIP: None
  selector:
    app: storage
  ports:
    - port: 50052
      targetPort: 50052
