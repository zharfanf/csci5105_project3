syntax = "proto3";

package marketplace;

// ITEMS (Section 3.1)

message Item {
    string item_id = 1;
    string seller_id = 2;
    string title = 3;
    string category = 4;
    string description = 5;
    double starting_price = 6;
    double current_price = 7;
    int32 quantity = 8;
    string status = 9;              // "active", "sold", "auction"
    int64 version = 10;             // optimistic concurrency / write ordering
}

// CLIENT MESSAGES (Section 3.2)

// -- CreateItem --
message CreateItemRequest {
    string seller_id = 1;
    string title = 2;
    string category = 3;
    string description = 4;
    double starting_price = 5;
    int32 quantity = 6;
    string status = 7;              // "active" or "auction"
}

message CreateItemResponse {
    bool success = 1;
    string item_id = 2;
    string message = 3;
}

// -- GetItem --
message GetItemRequest {
    string item_id = 1;
}

message GetItemResponse {
    bool success = 1;
    Item item = 2;
    string message = 3;
}

// -- SearchItems --
message SearchItemsRequest {
    string keyword = 1;
    string category = 2;
}

message SearchItemsResponse {
    bool success = 1;
    repeated Item items = 2;
    string message = 3;
}

// -- UpdateItem --
message UpdateItemRequest {
    string item_id = 1;
    string description = 2;
    int32 quantity = 3;
    string status = 4;
    double current_price = 5;
    int64 expected_version = 6;     // reject if item has been modified since this version
}

message UpdateItemResponse {
    bool success = 1;
    Item item = 2;
    string message = 3;
}

// -- PlaceBid --
message PlaceBidRequest {
    string item_id = 1;
    string bidder_id = 2;
    double bid_amount = 3;
}

message PlaceBidResponse {
    bool success = 1;
    double current_price = 2;
    string message = 3;
}

// AUCTION (Section 3.3)

message JoinAuctionRequest {
    string item_id = 1;
    string bidder_id = 2;
}

message AuctionUpdate {
    string item_id = 1;
    double current_price = 2;
    string bidder_id = 3;           // who placed the latest bid
    string event_type = 4;          // "new_bid", "auction_end", "joined"
    string message = 5;
    int64 version = 6;
}

