syntax = "proto3";

package marketplace;

// item stuff
message Item {
    string item_id = 1;
    string seller_id = 2;
    string title = 3;
    string category = 4;
    string description = 5;
    double starting_price = 6;
    double current_price = 7;
    int32 quantity = 8;
    string status = 9; // active, sold, auction
    int64 version = 10;
}

// ---- client facing messages ----

message CreateItemRequest {
    string seller_id = 1;
    string title = 2;
    string category = 3;
    string description = 4;
    double starting_price = 5;
    int32 quantity = 6;
    string status = 7;
}

message CreateItemResponse {
    bool success = 1;
    string item_id = 2;
    string message = 3;
}

message GetItemRequest {
    string item_id = 1;
}

message GetItemResponse {
    bool success = 1;
    Item item = 2;
    string message = 3;
}

message SearchItemsRequest {
    string keyword = 1;
    string category = 2;
}

message SearchItemsResponse {
    bool success = 1;
    repeated Item items = 2;
    string message = 3;
}

message UpdateItemRequest {
    string item_id = 1;
    string description = 2;
    int32 quantity = 3;
    string status = 4;
    double current_price = 5;
    int64 expected_version = 6; // for optimistic concurrency check
}

message UpdateItemResponse {
    bool success = 1;
    Item item = 2;
    string message = 3;
}

message PlaceBidRequest {
    string item_id = 1;
    string bidder_id = 2;
    double bid_amount = 3;
}

message PlaceBidResponse {
    bool success = 1;
    double current_price = 2;
    string message = 3;
}

// auction stuff

message JoinAuctionRequest {
    string item_id = 1;
    string bidder_id = 2;
}

message AuctionUpdate {
    string item_id = 1;
    double current_price = 2;
    string bidder_id = 3;
    string event_type = 4; // new_bid, auction_end, joined
    string message = 5;
    int64 version = 6;
}

// ---- storage messages ----
// these are used internally between service pods and replicas

message StorageWriteRequest {
    Item item = 1;
    string operation = 2; // create, update, bid
    int64 proposed_version = 3;
}

message StorageWriteResponse {
    bool success = 1;
    Item item = 2;
    string message = 3;
    int64 current_version = 4;
}

message StorageReadRequest {
    string item_id = 1;
}

message StorageReadResponse {
    bool success = 1;
    Item item = 2;
    string message = 3;
}

message StorageSearchRequest {
    string keyword = 1;
    string category = 2;
}

message StorageSearchResponse {
    bool success = 1;
    repeated Item items = 2;
}

// for read repair - service pod pushes newer version to stale replica
message RepairRequest {
    Item item = 1;
}

message RepairResponse {
    bool success = 1;
    string message = 2;
}

// state sync when a replica recovers
message SyncRequest {
    string replica_id = 1;
    int64 last_known_version = 2; // 0 means full sync
}

message SyncResponse {
    repeated Item items = 1;
    int64 latest_version = 2;
}

// controller heartbeat
message ReplicaHeartbeatRequest {
    string controller_id = 1;
}

message ReplicaHeartbeatResponse {
    string replica_id = 1;
    int64 item_count = 2;
    int64 latest_version = 3;
    bool healthy = 4;
}

// ---- services ----

// client facing api - service pods implement this
service FrontendService {
    rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
    rpc GetItem(GetItemRequest) returns (GetItemResponse);
    rpc SearchItems(SearchItemsRequest) returns (SearchItemsResponse);
    rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse);
    rpc PlaceBid(PlaceBidRequest) returns (PlaceBidResponse);
    rpc JoinAuction(JoinAuctionRequest) returns (stream AuctionUpdate);
}

// storage api - all replicas expose this, they're all peers
service StorageService {
    rpc Write(StorageWriteRequest) returns (StorageWriteResponse);
    rpc Read(StorageReadRequest) returns (StorageReadResponse);
    rpc Search(StorageSearchRequest) returns (StorageSearchResponse);
    rpc Repair(RepairRequest) returns (RepairResponse);
    rpc SyncState(SyncRequest) returns (SyncResponse);
    rpc CheckHealth(ReplicaHeartbeatRequest) returns (ReplicaHeartbeatResponse);
}